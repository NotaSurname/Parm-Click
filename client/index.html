<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARMCLICKER</title>
    <link rel="shortcut icon" href="assets/img/small_cheese.png" type="image/x-icon">
    <script src="scripts/index.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div class="h-screen bg-amber-50 flex justify-center items-center">
    <div class="h-full w-full">

        <div class="flex flex-col bg-amber-400 w-full justify-center items-center gap-4 p-4 py-6">
            <div class="flex flex-wrap justify-between w-full max-w-5xl items-start gap-2 px-2">
                <div class="flex gap-2 flex-wrap">
                    <button
                            class="bg-amber-600 text-white font-bold py-2 px-3 rounded-lg
                            hover:bg-amber-700 hover:scale-105 hover:cursor-pointer
                            active:scale-95 transition text-sm" id="save-button">
                        💾 SAVE
                    </button>
                    <button
                            class="bg-red-500 text-white font-bold py-2 px-3 rounded-lg
                            hover:bg-red-600 hover:scale-105 hover:cursor-pointer
                            active:scale-95 transition text-sm" id="reset-button">
                        ⚠️ RESET
                    </button>
                    <button id="logout-button"
                            class="bg-red-500 text-white font-bold py-2 px-3 rounded-lg text-sm
                            hover:bg-red-600 hover:scale-105 hover:cursor-pointer active:scale-95 transition">
                        Déconnexion
                    </button>
                </div>

                <div id="error-message" class="text-center text-red-600 font-bold text-sm hidden">
                </div>

                <div class="flex items-center gap-3">
                    <span id="user-name" class="text-amber-900 font-semibold text-sm"></span>
                    <div class="bg-white/50 rounded-lg px-3 py-2 min-w-[140px]">
                        <p id="cheese-total" class="text-lg font-black text-amber-900 text-right">0 🧀</p>
                        <p id="cheese-click" class="text-xs text-amber-700 text-right mt-0.5">1 click = 1 🧀</p>
                        <p id="cheese-per-second" class="text-xs text-amber-700 text-right">0 🧀/s</p>
                    </div>
                </div>
            </div>

            <h1 class="font-black text-3xl md:text-4xl text-amber-900">
                🧀 PARM'CLICK 🧀
            </h1>

            <div class="flex flex-col items-center lg:grid lg:grid-cols-3 lg:items-center gap-6 w-full max-w-6xl px-4">

                <!-- Colonne gauche vide (équilibre) -->
                <div class="hidden lg:block"></div>

                <div class="relative flex items-center justify-center flex-shrink-0">
                    <!-- Halo externe animé -->
                    <div class="absolute w-52 h-52 md:w-64 md:h-64 rounded-full bg-amber-300/40 animate-ping" style="animation-duration: 2s;"></div>
                    <!-- Cercle de glow -->
                    <div class="absolute w-44 h-44 md:w-56 md:h-56 rounded-full bg-amber-200/60 blur-xl"></div>
                    <!-- Cercle de fond -->
                    <div class="absolute w-40 h-40 md:w-52 md:h-52 rounded-full bg-amber-300/50 shadow-[0_0_40px_10px_rgba(251,191,36,0.5)]"></div>

                    <div id="cheese-container" class="absolute w-40 h-40 md:w-52 md:h-52 animate-spin">
                    </div>

                    <img    alt="Cheese to click"
                            src="assets/img/cheese_1.png"
                            class="relative w-36 h-36 md:w-44 md:h-44 z-10 cursor-pointer
                                   hover:scale-110 active:scale-95 transition duration-150
                                   drop-shadow-[0_8px_24px_rgba(180,83,9,0.5)]"
                            id="cheese_to_click"
                            draggable="false"
                    />
                </div>

                <div class="bg-white p-5 rounded-xl shadow-xl w-full max-w-[400px] lg:max-w-none lg:justify-self-end border border-amber-200" id="ia">
                    <div class="flex items-center gap-3 mb-4 pb-3 border-b border-amber-100">
                        <div class="w-11 h-11 bg-amber-500 rounded-full flex items-center justify-center flex-shrink-0">
                            <span class="text-xl">🧀</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-amber-900 text-lg">Maître Fromager</h3>
                            <p class="text-xs text-amber-500">Assistant IA</p>
                        </div>
                    </div>

                    <div id="ia-messages" class="flex flex-col gap-3 h-48 md:h-64 overflow-y-auto mb-4 p-3 bg-amber-50 rounded-lg">
                        <p class="text-sm text-amber-400 italic text-center py-4">Posez une question...</p>
                    </div>

                    <div class="flex gap-2">
                        <input
                            type="text"
                            id="ia-input"
                            placeholder="Votre message..."
                            class="flex-1 px-4 py-3 text-sm bg-amber-50 border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 placeholder-amber-300"
                        />
                        <button
                            id="ia-send"
                            class="bg-amber-500 text-white px-4 py-3 rounded-lg hover:bg-amber-600 active:scale-95 transition font-bold"
                        >
                            ➤
                        </button>
                    </div>
                </div>

            </div>

        </div>

        <div class="flex flex-col bg-amber-50 min-h-screen w-full">

            <header class="bg-amber-500 w-full mb-6">
                <h1 class="font-black text-3xl p-6 text-white text-center tracking-wide uppercase">
                    🛒 La Fromagerie 🛒
                </h1>
            </header>

            <div class="px-6 pb-10 w-full">
                <div class="flex gap-2 mb-8 justify-center p-1.5 bg-amber-100 rounded-lg w-fit mx-auto">
                    <button
                            id="clicks-upgrades-button"
                            class="px-6 py-2.5 font-semibold text-amber-700 rounded-md hover:bg-amber-500 transition-all duration-200"
                    >
                        🖱️ Clics
                    </button>
                    <button
                            id="auto-upgrades-button"
                            class="px-6 py-2.5 font-semibold text-amber-700 rounded-md hover:bg-amber-500 transition-all duration-200"
                    >
                        ⚙️ Auto
                    </button>
                </div>
                <div id="items-shop"
                     class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 w-full max-w-6xl mx-auto">
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
